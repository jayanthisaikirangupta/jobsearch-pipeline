[project]
name = "jobsearch"
version = "0.1.0"
description = "Sponsor-licensed UK job search pipeline: ingest -> filter -> score -> tailor -> track -> apply"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    # python-jobspy is installed separately with --no-deps because upstream
    # hard-pins numpy==1.26.3 (no Python 3.13 wheel). See Makefile target.
    "httpx>=0.27",
    "pandas>=2.2.3",
    "numpy>=2.1",
    "rapidfuzz>=3.6",
    "anthropic[bedrock]>=0.40",
    "boto3>=1.34",
    "python-docx>=1.1",
    "docx2txt>=0.8",
    "rich>=13.7",
    "tenacity>=8.2",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
apply = ["browser-use>=0.1.40", "playwright>=1.45"]
pdf = ["docx2pdf>=0.1.8"]
dashboard = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "jinja2>=3.1"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
jobsearch = "jobsearch.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
