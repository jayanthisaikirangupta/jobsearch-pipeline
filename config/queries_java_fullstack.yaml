# Java + Full Stack across all 14 low-competition UK cities from
# config/queries.yaml. Uses the same 4 sources (adzuna, indeed, linkedin,
# glassdoor). Councils source excluded — wmjobs has ~zero Java / Full
# Stack council roles.
#
# Usage (append to preserve any existing rows from other configs):
#   python -m jobsearch.cli ingest run --config config/queries_java_fullstack.yaml --append
#   python -m jobsearch.cli filter run --no-export
#   python -m jobsearch.cli score run --no-export

defaults:
  country_indeed: UK
  hours_old: 96          # 4 days
  results_wanted: 1000
  description_format: markdown
  distance: 20

_sources: &sources [adzuna, indeed, linkedin, glassdoor]

queries:
  # ---- Belfast ----
  - label: java-belfast
    search_term: "Java Developer"
    location: "Belfast"
    sources: *sources
  - label: fullstack-belfast
    search_term: "Full Stack Developer"
    location: "Belfast"
    sources: *sources

