# Master query config. Role coverage × UK low-competition cities only.
#
# Goal: surface AI / GenAI / data / software roles in regional UK hubs where
# applicant volume per posting is materially lower than London / Manchester /
# Cambridge / Oxford / Bristol / Edinburgh. ML Engineer titles are excluded
# per Sai's profile focus (GenAI + applied AI, not classic ML modelling).
#
# No UK-wide block: blank/country-level locations cause LinkedIn to surface
# US + remote-anywhere roles, and Indeed without a city pulls nationwide
# noise. Every query targets a specific researched UK city so the dataset
# stays UK-only AND inside the low-competition target set.
#
# Every query hits ALL four sources: Adzuna + Indeed + LinkedIn + Glassdoor.
# Glassdoor's resolver strips "City, Country" -> "City" inside
# ingest/sources/_jobspy.py, so plain city names work across all four
# sources without per-query overrides.
#
# Per-city role coverage (broad terms — each substring-matches many titles):
#   "Generative AI"      -> GenAI Engineer/Developer/Lead/Architect/Specialist/Consultant
#   "AI Engineer"        -> AI / Senior AI / Lead AI / Applied AI / AI Solutions Engineer
#   "AI Developer"       -> AI Developer / GenAI Developer / LLM Developer
#   "LLM"                -> LLM Engineer / LLM Developer / LLM Ops
#   "NLP"                -> NLP Engineer / NLP Scientist / NLP Developer
#   "AI Architect"       -> AI Solutions Architect / GenAI Architect / Principal AI Architect
#   "AI Consultant"      -> AI Consultant / GenAI Consultant / AI Strategy
#   "Data Engineer"      -> Data / Senior Data / Lead Data Engineer (SOC 2133)
#
# Location list (research 2026-06-30 — Tech Nation / DSIT AI Sector Study
# 2025, Whitecap FinTech reports, Invest NI, CSConnected, Indeed posting-
# volume sweeps, Home Office sponsor register 2026-06-30):
#
#   Belfast        — Kainos, Liberty IT, Allstate NI, FinTrU, AquaQ
#   Glasgow        — AutoRek, ThinkAnalytics, BAE Govan, JPMC, Morgan Stanley
#   Newcastle      — Sage HQ, Atom Bank, Scott Logic, NIC for Data (Helix)
#   Southampton    — RAi-UK host, Ordnance Survey, Roke Manor, Lloyd's Register
#   Cardiff        — Admiral, Amplyfi, Antiverse, Companies House, ONS-adjacent
#   Coventry       — MTC + WMG catapults, JLR, Aptiv, KPIT, FANUC
#   Milton Keynes  — Connected Places Catapult, OU KMi, Santander, MB Financial Services
#   Nottingham     — Experian, Capital One Europe, Boots, E.ON, BlueSkeye AI
#   Leeds          — LIDA, BJSS, TransUnion, Asda HQ, Jet2, EMIS, Aire Logic
#   Aberdeen       — Arria NLG, Aker Solutions, Wood plc, RGU energy-AI
#   Newport        — Compound Semi Catapult, General Dynamics UK, KLA, ONS, USW
#   Exeter         — Met Office HQ, IDSAI (Turing partner), digiLab, HydroSurv
#   Ipswich        — BT Adastral Park / Innovation Martlesham (~80 firms)
#   Northampton    — Leonardo, easyJet, Carlsberg-Marston's (narrow, Sai-requested)
#
# Adzuna free tier = 250 calls/day per app_id; each query burns up to 3 calls
# (3 pages * 50). 14 cities × 8 roles × 3 pages = 336 calls — OVER the 250
# daily cap. Splitting Adzuna queries across two runs/day handles this; the
# runner already gracefully drops a source if the API 4xxs mid-page.

defaults:
  country_indeed: UK
  hours_old: 96          # 4 days
  results_wanted: 1000
  description_format: markdown
  distance: 20

_sources: &sources [adzuna, indeed, linkedin, glassdoor]

