# Master query config. Adzuna-only, UK-wide.
#
# Free tier is 250 calls/day per app_id; each query below burns up to 3 calls
# (3 pages * 50 results). With ~14 queries that's ~42 calls per ingest run,
# well within budget.
#
# Location strategy: empty `where` -> Adzuna treats as nationwide UK. The
# `gb` country code in the endpoint already pins it to the UK.
#
# Structure:
#   1. Core AI / GenAI — broadened: every common title variant
#   2. SWE / full-stack — TCS-Lloyds + K+N backend depth
#   3. Data engineering — SOC 2133 fit (Data Scientist + ML Engineer
#      intentionally excluded per profile focus)

defaults:
  country_indeed: UK
  hours_old: 96          # 4 days
  results_wanted: 1000
  description_format: markdown
  distance: 20            # ignored when `where` is empty (nationwide)

queries:
  # ===== 1. Core AI / GenAI — cast wide on title variants =====
  - label: ai-engineer-uk
    search_term: "AI Engineer"
    location: ""
    sources: [adzuna]

  - label: genai-engineer-uk
    search_term: "Generative AI Engineer"
    location: ""
    sources: [adzuna]

  - label: llm-engineer-uk
    search_term: "LLM Engineer"
    location: ""
    sources: [adzuna]

  - label: applied-ai-engineer-uk
    search_term: "Applied AI Engineer"
    location: ""
    sources: [adzuna]

  - label: ai-developer-uk
    search_term: "AI Developer"
    location: ""
    sources: [adzuna]

  - label: ai-software-engineer-uk
    search_term: "AI Software Engineer"
    location: ""
    sources: [adzuna]

  - label: prompt-engineer-uk
    search_term: "Prompt Engineer"
    location: ""
    sources: [adzuna]

  - label: nlp-engineer-uk
    search_term: "NLP Engineer"
    location: ""
    sources: [adzuna]

  # ===== 2. SWE / full-stack =====
  - label: software-engineer-uk
    search_term: "Software Engineer"
    location: ""
    sources: [adzuna]

  - label: fullstack-engineer-uk
    search_term: "Full Stack Engineer"
    location: ""
    sources: [adzuna]

  - label: backend-engineer-uk
    search_term: "Backend Engineer"
    location: ""
    sources: [adzuna]

  - label: java-developer-uk
    search_term: "Java Developer"
    location: ""
    sources: [adzuna]

  - label: python-developer-uk
    search_term: "Python Developer"
    location: ""
    sources: [adzuna]

  # ===== 3. Data engineering =====
  - label: data-engineer-uk
    search_term: "Data Engineer"
    location: ""
    sources: [adzuna]
