  # ---- Hosted-ATS direct (Greenhouse / Lever / Ashby / Workable / SmartRecruiters) ----
  # Every company in config/sponsor_tokens.yaml is a pre-vetted licensed
  # sponsor, so these queries run UK-wide: the token list IS the filter,
  # and the scorer handles location preference. Jobs land on these boards
  # hours-to-days before Indeed/LinkedIn scrape them, and the apply URL is
  # the company's own portal (not an aggregator redirect).
  #
  # Lane 1 = Software / Full-Stack (Java or Python backend, Angular/React).
  # Lane 2 = Applied AI Engineer (GenAI / LLM / agentic).
  - label: ats-lane1-software
    search_term: "Software Engineer OR Software Developer OR Java OR Python Developer OR Full Stack OR Full-Stack OR Backend Engineer OR React Developer OR Frontend Engineer"
    location: "United Kingdom"
    sources: [greenhouse, lever, ashby, workable, smartrecruiters]
  - label: ats-lane2-ai
    search_term: "AI Engineer OR Generative AI OR GenAI OR LLM OR AI Developer OR Applied AI"
    location: "United Kingdom"
    sources: [greenhouse, lever, ashby, workable, smartrecruiters]

  # ---- UK councils / local government (wmjobs.co.uk) ----
  # Council roles almost never sponsor Skilled Worker for tech, but the
  # board carries genuine AI / data / software openings across ~30
  # English councils + combined authorities. Kept UK-wide (no location
  # override) so we don't miss anything; the tailor step still filters
  # on the sponsor register.
  - label: councils-ai
    search_term: "AI"
    location: "United Kingdom"
    sources: [councils]
  - label: councils-data-engineer
    search_term: "Data Engineer"
    location: "United Kingdom"
    sources: [councils]
  - label: councils-software-engineer
    search_term: "Software Engineer"
    location: "United Kingdom"
    sources: [councils]
  - label: councils-machine-learning
